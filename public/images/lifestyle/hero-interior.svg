<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2EEE7" />
      <stop offset="100%" stop-color="#E5DFC" />
    </linearGradient>
    <linearGradient id="sunLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9ED" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFF9ED" stop-opacity="0" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#252525" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Wall Background -->
  <rect width="800" height="600" fill="url(#wallGrad)" />

  <!-- Sunbeam Window Light Accent -->
  <polygon points="150,0 450,0 700,600 200,600" fill="url(#sunLight)" />

  <!-- Wooden Floor -->
  <rect y="460" width="800" height="140" fill="#DDD1C1" />
  <line x1="0" y1="460" x2="800" y2="460" stroke="#C5B59E" stroke-width="2" />
  <line x1="200" y1="460" x2="150" y2="600" stroke="#C5B59E" stroke-width="1" stroke-dasharray="8 4" />
  <line x1="450" y1="460" x2="400" y2="600" stroke="#C5B59E" stroke-width="1" stroke-dasharray="8 4" />

  <!-- Minimalist Armchair / Bench -->
  <g filter="url(#softShadow)">
    <!-- Bench Wooden Frame -->
    <rect x="220" y="380" width="360" height="24" rx="4" fill="#8C7355" />
    <!-- Bench Legs -->
    <rect x="240" y="404" width="16" height="80" fill="#6B553E" />
    <rect x="540" y="404" width="16" height="80" fill="#6B553E" />
    <!-- Cushions -->
    <rect x="230" y="340" width="165" height="42" rx="12" fill="#EDE9E1" stroke="#DDD8CF" stroke-width="2" />
    <rect x="405" y="340" width="165" height="42" rx="12" fill="#EDE9E1" stroke="#DDD8CF" stroke-width="2" />
    <!-- Soft Decorative Pillow (Flower/Warm Terracotta) -->
    <circle cx="300" cy="320" r="32" fill="#B77B61" />
    <circle cx="300" cy="320" r="10" fill="#F7F5F0" />
  </g>

  <!-- Modern Side Table & Lamp -->
  <g filter="url(#softShadow)">
    <rect x="620" y="360" width="100" height="12" rx="3" fill="#B2A490" />
    <rect x="664" y="372" width="12" height="110" fill="#8C7355" />
    <!-- Lamp base -->
    <path d="M 650 360 C 650 320, 690 320, 690 360 Z" fill="#4E5745" />
    <rect x="666" y="280" width="8" height="40" fill="#B2A490" />
    <!-- Lamp Shade -->
    <polygon points="640,285 700,285 715,220 625,220" fill="#FAF8F5" stroke="#E5DFC" stroke-width="2" />
  </g>

  <!-- Potted Botanical Plant -->
  <g filter="url(#softShadow)">
    <!-- Ceramic Pot -->
    <path d="M 90 480 L 110 390 L 170 390 L 190 480 Z" fill="#EDE9E1" stroke="#DDD8CF" stroke-width="2" />
    <!-- Monstera Leaves -->
    <path d="M 140 390 Q 100 300 50 310 Q 90 360 140 390 Z" fill="#4E5745" />
    <path d="M 140 390 Q 150 250 200 240 Q 180 320 140 390 Z" fill="#3F4737" />
    <path d="M 140 390 Q 190 310 240 340 Q 170 370 140 390 Z" fill="#5C6652" />
  </g>

  <!-- Wall Art Framed -->
  <rect x="300" y="80" width="200" height="240" fill="#FFFFFF" rx="4" filter="url(#softShadow)" stroke="#DDD8CF" stroke-width="4" />
  <circle cx="400" cy="180" r="50" fill="#EDE9E1" />
  <path d="M 370 230 C 370 160, 440 210, 430 150" stroke="#B77B61" stroke-width="6" stroke-linecap="round" fill="none" />
</svg>
