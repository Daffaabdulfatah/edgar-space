<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDE9E1" />
      <stop offset="100%" stop-color="#F7F5F0" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#252525" flood-opacity="0.05" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Wooden Table Surface -->
  <rect y="380" width="800" height="220" fill="#D8CAB8" />
  <line x1="0" y1="380" x2="800" y2="380" stroke="#C5B59E" stroke-width="3" />

  <!-- Decorative Accessories Arrangement -->
  <!-- Ceramic Vase with Dried Grass -->
  <g filter="url(#softShadow)">
    <!-- Vase -->
    <path d="M 220 380 Q 180 300 210 240 Q 230 200 240 200 Q 250 200 270 240 Q 300 300 260 380 Z" fill="#FFFFFF" stroke="#DDD8CF" stroke-width="2" />
    <!-- Stems & Dried Grass -->
    <path d="M 240 200 Q 210 100 180 80" stroke="#B77B61" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 240 200 Q 250 90 260 60" stroke="#8C7355" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 240 200 Q 280 110 320 90" stroke="#4E5745" stroke-width="3" fill="none" stroke-linecap="round" />
  </g>

  <!-- Wooden Tray with Pump Bottle and Scented Candle -->
  <g filter="url(#softShadow)">
    <!-- Oval Tray -->
    <ellipse cx="500" cy="410" rx="180" ry="40" fill="#8C7355" stroke="#6B553E" stroke-width="2" />
    <ellipse cx="500" cy="405" rx="172" ry="36" fill="#A38B6D" />

    <!-- Pump Bottle -->
    <rect x="420" y="270" width="60" height="120" rx="16" fill="#4E5745" />
    <rect x="440" y="240" width="20" height="30" fill="#DDD8CF" />
    <path d="M 450 240 L 450 220 L 415 220" stroke="#252525" stroke-width="6" fill="none" stroke-linecap="round" />

    <!-- Ceramic Scented Candle -->
    <rect x="520" y="320" width="70" height="75" rx="8" fill="#F7F5F0" stroke="#DDD8CF" stroke-width="2" />
    <!-- Flame Warm Glow -->
    <circle cx="555" cy="305" r="16" fill="#B77B61" opacity="0.3" />
    <path d="M 555 315 C 550 300 555 295 555 295 C 555 295 560 300 555 315 Z" fill="#B77B61" />
  </g>
</svg>
