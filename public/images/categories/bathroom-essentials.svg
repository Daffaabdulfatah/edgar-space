<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <rect width="600" height="450" fill="#F7F5F0" />
  <rect x="20" y="20" width="560" height="410" fill="#EDE9E1" rx="16" />
  <!-- Bath Soap Dispenser & Toothbrush Holder Graphic -->
  <g transform="translate(180, 90)">
    <!-- Dispenser -->
    <rect x="40" y="90" width="80" height="150" rx="18" fill="#4E5745" />
    <rect x="70" y="55" width="20" height="35" fill="#DDD8CF" />
    <path d="M 80 55 L 80 35 L 45 35" stroke="#252525" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Toothbrush holder -->
    <rect x="150" y="120" width="90" height="120" rx="12" fill="#FFFFFF" stroke="#DDD8CF" stroke-width="4" />
    <line x1="175" y1="60" x2="175" y2="120" stroke="#B77B61" stroke-width="6" stroke-linecap="round" />
    <line x1="215" y1="50" x2="215" y2="120" stroke="#8C7355" stroke-width="6" stroke-linecap="round" />
  </g>
</svg>
